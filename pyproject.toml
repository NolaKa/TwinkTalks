[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinktalks"
version = "0.1.0"
description = "PDF & EPUB to speech using Qwen3-TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qwen-tts>=0.1.1",
    "torch>=2.10.0",
    "soundfile>=0.13.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.25.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "nltk>=3.9",
    "numpy>=1.26,<2.0",
    "pydub>=0.25.1",
    "mutagen>=1.47",
    "tqdm>=4.66",
    "gradio>=5.0",
    "langdetect>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Scanned-PDF OCR. Also requires system: brew install tesseract ghostscript qpdf
ocr = ["ocrmypdf>=16.0"]

[project.scripts]
twinktalks = "twinktalks.cli:main"
twinktalks-web = "twinktalks.web:main"

[tool.setuptools.packages.find]
include = ["twinktalks*"]
exclude = ["tests*", "output*"]

[tool.setuptools.package-data]
twinktalks = ["assets/*.css"]
